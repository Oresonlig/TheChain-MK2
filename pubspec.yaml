name: the_chain
description: The Chain MK2 — workout tracking, Flutter rewrite of the MK1 web app.
publish_to: 'none'

# Versionen sätts av CI (--build-name/--build-number), inte här.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Appikonen (Nanosuit-omfärgad MK1-ikon, tool/make_icon.mjs). Genereras i CI
# efter `flutter create` eftersom android/ inte spåras under F0–F3.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_foreground: assets/icon/icon.png
  adaptive_icon_background: "#0C151C"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Saira (OFL, assets/fonts/Saira-OFL.txt) — variabel vikt/bredd, hämtad med tool/fetch_fonts.mjs
  fonts:
    - family: Saira
      fonts:
        - asset: assets/fonts/Saira-Variable.ttf
        - asset: assets/fonts/Saira-Italic-Variable.ttf
          style: italic
