name: Build MK2

# F0 — varje push till main bygger DEV-kanalen (com.oresonlig.thechain.dev,
# "The Chain DEV") och publicerar den som prerelease `dev-latest`. Bara Niklas
# har länken; testarna (MK1 / stabil kanal) påverkas inte.
# Lärdomar som styr upplägget: TheChain_MK2/LESSONS_MK1_ANDROID.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # prerelease

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ spåras inte under F0 — genereras här varje gång.
      - name: Generate Android platform
        run: flutter create --platforms android --org com.oresonlig --project-name the_chain .

      - name: Install dependencies
        run: flutter pub get

      # Appikonen (assets/icon/, Nanosuit-omfärgad) in i det genererade android/.
      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode signing key
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets — DEV build is debug-signed (cannot update over a previous install)."
          fi

      - name: Configure DEV channel
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
        run: node tool/configure_android.mjs dev

      # Byggnumret = körningsnumret → ökar alltid, så nya DEV-byggen installeras
      # ovanpå gamla (LESSONS §2: versionCode måste öka).
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --build-name 0.1.${{ github.run_number }}
          --build-number ${{ github.run_number }}
          --dart-define=CHANNEL=dev
          --dart-define=BUILD=${{ github.run_number }}

      - name: Publish DEV prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk thechain-dev.apk
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest thechain-dev.apk \
            --prerelease --latest=false --target "${{ github.sha }}" \
            --title "MK2 DEV build ${{ github.run_number }}" \
            --notes "DEV channel (com.oresonlig.thechain.dev). Build ${{ github.run_number }}, commit ${{ github.sha }}."
