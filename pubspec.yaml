name: the_chain
description: The Chain MK2 — workout tracking, Flutter rewrite of the MK1 web app.
publish_to: 'none'

# Versionen sätts av CI (--build-name/--build-number), inte här.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Saira (OFL, assets/fonts/Saira-OFL.txt) — variabel vikt/bredd, hämtad med tool/fetch_fonts.mjs
  fonts:
    - family: Saira
      fonts:
        - asset: assets/fonts/Saira-Variable.ttf
        - asset: assets/fonts/Saira-Italic-Variable.ttf
          style: italic
